name: BlackMarket
options:
  bundleIdPrefix: com.blackmarket.game
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  BlackMarket:
    type: application
    platform: iOS
    sources:
      - path: BlackMarket
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: BLACKMARKET
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blackmarket.game.app
        PRODUCT_NAME: BlackMarket
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
